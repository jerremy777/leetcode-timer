<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Save attempt — LeetCode Timer</title>
<link rel="stylesheet" href="page.css">
</head>
<body>
  <div class="wrap">
    <h1>Finish saving your attempt</h1>
    <p id="why" class="muted"></p>
    <p><b id="fname"></b></p>
    <button id="save" class="primary">Save to folder</button>
    <button id="choose" class="hidden">Choose folder…</button>
    <p id="result"></p>
    <details>
      <summary>Preview</summary>
      <pre id="preview"></pre>
    </details>
  </div>
  <script type="module" src="save.js"></script>
</body>
</html>
